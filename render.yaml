databases:
  - name: restiq-db
    databaseName: restiq
    user: restiq
    plan: starter

services:
  - type: web
    name: restiq
    env: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: restiq-db
          property: connectionString
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: EMBED_SIG_SECRET
        sync: false
      - key: SHOPIFY_SCOPES
        value: read_products,read_inventory,write_script_tags,write_webhooks
      - key: ALLOW_DEV_SEED
        value: "false"
