services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sizesignal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sizesignal"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/sizesignal
      APP_URL: http://localhost:3001
      SHOPIFY_API_KEY: ${SHOPIFY_API_KEY}
      SHOPIFY_API_SECRET: ${SHOPIFY_API_SECRET}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      EMBED_SIG_SECRET: ${EMBED_SIG_SECRET}
      SHOPIFY_SCOPES: ${SHOPIFY_SCOPES}
      ALLOW_DEV_SEED: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"

volumes:
  pgdata: {}
